[project]
name = "aibiz_auth"
version = "0.1.0"
description = "FastAPI dependency: Supabase platform session + core service role check"
requires-python = ">=3.10"
dependencies = ["fastapi", "pyjwt[crypto]"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aibiz_auth"]
