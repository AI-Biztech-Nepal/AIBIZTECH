# nginx for AIBIZTECH's own Stock Manager: serves the built React app and passes /api to the backend on port 8101.
#   sudo cp nginx-stock-portal.conf /etc/nginx/sites-available/stock-portal
#   sudo ln -s /etc/nginx/sites-available/stock-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <new-stock-address>
#   sudo mkdir -p /var/www/stock-portal-frontend && sudo chown -R $USER /var/www/stock-portal-frontend
server {
    listen 80;
    server_name <new-stock-address>;
    root /var/www/stock-portal-frontend;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
